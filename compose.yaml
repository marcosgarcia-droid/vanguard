services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID}
        GID: ${GID}
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    depends_on:
      - mysql
      - redis
      - mailpit

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID}
        GID: ${GID}
    working_dir: /var/www/html
    command: php artisan queue:work redis --sleep=3 --tries=3 --timeout=90
    restart: unless-stopped
    volumes:
      - ./src:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  facial-vision:
    profiles:
      - facial-vision
    build:
      context: ./docker/facial-vision
      target: runtime
    restart: unless-stopped
    init: true
    environment:
      VANGUARD_FACIAL_VISION_TOKEN: ${VANGUARD_FACIAL_PHOTO_VALIDATION_LOCAL_VISION_TOKEN:-}
      VANGUARD_FACIAL_VISION_VERSION: foundation-v1
      VANGUARD_FACIAL_VISION_MAXIMUM_REQUEST_BYTES: 5242880
      VANGUARD_FACIAL_VISION_ANALYSIS_ENABLED: ${VANGUARD_FACIAL_VISION_ANALYSIS_ENABLED:-false}
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
  mysql:
    image: mysql:latest
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: vanguard
      MYSQL_USER: vanguard
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  composer:
    profiles:
      - tools
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID}
        GID: ${GID}
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
      - composer-cache:/tmp/cache
    environment:
      COMPOSER_CACHE_DIR: /tmp/cache
    entrypoint: ["composer"]

  node:
    profiles:
      - tools
    image: node:latest
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    ports:
      - "5173:5173"
    user: "${UID}:${GID}"

volumes:
  composer-cache:
  mysql-data:
  redis-data:
